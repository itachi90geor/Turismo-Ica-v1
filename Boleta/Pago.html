<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasarela de Pago | Turismo Ica</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/Prueba2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          src="https://res.cloudinary.com/dsk6vsr0c/image/upload/q_auto/f_auto/v1777767088/Logo_qum5kw.png"
          alt="Logo de Turismo Ica"
          class="logo-imagen"
        />
        <span class="logo-texto"><h1>Turismo Ica</h1></span>
      </div>
      <div class="contenedor-derecha-header">
        <a href="../Login.html" title="Login" class="enlace-perfil-usuario">
          <i class="fa-solid fa-user"></i>
        </a>
        <button class="menu-hamburguesa" id="botonMenu" aria-label="Abrir menú">
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
        </button>
      </div>
      <nav id="menuPrincipal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="../Nosotros.html">Nosotros</a></li>
          <li><a href="../Destino.html">Destinos</a></li>
          <li><a href="../Reserva.html">Reservas</a></li>
          <li><a href="../Tabla_Descuento.html">Descuentos</a></li>
          <li><a href="../Preguntas.html">Preguntas</a></li>
        </ul>
      </nav>
    </header>

    <main class="pantalla-completa-con-fondo">
      <div class="cuadro-vidrio-borroso">
        <h2 class="texto-titulo-grande">Confirmar Pago</h2>

        <form id="formularioPago" autocomplete="off">
          <div class="contenedor-pregunta-respuesta">
            <label for="tarjeta-nombre">Nombre del Titular</label>
            <div class="caja-con-icono">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                id="tarjeta-nombre"
                placeholder="Nombre como aparece en la tarjeta"
                required
              />
            </div>
          </div>

          <div class="contenedor-pregunta-respuesta">
            <label for="tarjeta-numero">Número de Tarjeta</label>
            <div class="caja-con-icono">
              <i class="fa-solid fa-credit-card"></i>
              <input
                type="text"
                id="tarjeta-numero"
                placeholder="0000 0000 0000 0000"
                maxlength="19"
                required
              />
            </div>
          </div>

          <div class="fila-formulario-doble">
            <div class="contenedor-pregunta-respuesta">
              <label for="tarjeta-fecha">Vencimiento</label>
              <div class="caja-con-icono">
                <i class="fa-solid fa-calendar-days"></i>
                <input
                  type="text"
                  id="tarjeta-fecha"
                  placeholder="MM/AA"
                  maxlength="5"
                  required
                />
              </div>
            </div>
            <div class="contenedor-pregunta-respuesta">
              <label for="tarjeta-cvv">CVV</label>
              <div class="caja-con-icono">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="tarjeta-cvv"
                  placeholder="123"
                  maxlength="3"
                  required
                />
              </div>
            </div>
          </div>

          <button type="submit" class="boton-rojo-ingresar" id="btnPagar">
            <span id="textoBoton">Pagar Ahora</span>
            <div id="spinner" class="loader oculto"></div>
          </button>
        </form>
      </div>

      <div id="modalExito" class="overlay-pago oculto">
        <div class="contenido-exito">
          <div class="checkmark-wrapper">
            <svg
              class="checkmark"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 52 52"
            >
              <circle
                class="checkmark__circle"
                cx="26"
                cy="26"
                r="25"
                fill="none"
              />
              <path
                class="checkmark__check"
                fill="none"
                d="M14.1 27.2l7.1 7.2 16.7-16.8"
              />
            </svg>
          </div>
          <h3>¡Pago Realizado!</h3>
          <p>Tu reserva ha sido confirmada con éxito.</p>
          <a
            href="../Reserva.html"
            class="boton-rojo-ingresar boton-centrado-chico"
            >Ver mis Reservas</a
          >
        </div>
      </div>
    </main>

    <footer>
      <p>Grupo 6, 2026 Turismo Ica. Todos los derechos reservados.</p>
      <p>Vive la experiencia del eterno sol.</p>
    </footer>

    <script src="../JavaScript/Prueba2.js"></script>
  </body>
</html>
