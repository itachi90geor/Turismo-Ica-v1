<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar | Turismo Ica</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/Prueba2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          src="https://res.cloudinary.com/dsk6vsr0c/image/upload/q_auto/f_auto/v1777767088/Logo_qum5kw.png"
          alt="Logo de Turismo Ica"
          class="logo-imagen"
        />
        <span class="logo-texto"><h1>Turismo Ica</h1></span>
      </div>
      <div class="contenedor-derecha-header">
        <a href="Login.html" title="Login" class="enlace-perfil-usuario">
          <i class="fa-solid fa-user"></i>
        </a>
        <button class="menu-hamburguesa" id="botonMenu" aria-label="Abrir menú">
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
        </button>
      </div>
      <nav id="menuPrincipal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="Nosotros.html">Nosotros</a></li>
          <li><a href="Destino.html">Destinos</a></li>
          <li><a href="Reserva.html">Reservas</a></li>
          <li><a href="Tabla_Descuento.html">Descuentos</a></li>
          <li><a href="Preguntas.html">Preguntas</a></li>
        </ul>
      </nav>
    </header>

    <main class="pantalla-completa-con-fondo">
      <div class="cuadro-vidrio-borroso">
        <h2>¡Bienvenido de vuelta!</h2>

        <form onsubmit="return false;">
          <div class="contenedor-pregunta-respuesta">
            <label for="email">Correo electrónico</label>
            <div class="caja-con-icono">
              <i class="fa-solid fa-envelope"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>
          </div>

          <div class="contenedor-pregunta-respuesta">
            <label for="password">Contraseña</label>
            <div class="caja-con-icono">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Crea una contraseña segura"
                required
              />
            </div>
          </div>

          <button type="submit" class="boton-rojo-ingresar">
            Ingresar a mi cuenta
          </button>

          <p class="enlace-intercambio">
            ¿Aún no tienes cuenta? <br />
            <a href="Registro.html">Regístrate aquí</a>
          </p>
        </form>
      </div>
    </main>

    <footer>
      <p>Grupo 6, 2026 Turismo Ica. Todos los derechos reservados.</p>
      <p>Vive la experiencia del eterno sol.</p>
    </footer>
    <script src="JavaScript/Prueba2.js"></script>
  </body>
</html>
