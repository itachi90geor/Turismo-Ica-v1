<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | Admin Ica</title>
    <link rel="stylesheet" href="css/Prueba2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <script>
      if (sessionStorage.getItem("rolUsuario") !== "admin") {
        alert("Acceso denegado. Solo administradores.");
        window.location.href = "index.html";
      }
    </script>
  </head>
  <body class="cuerpo-perfil">
    <header>
      <div class="logo">
        <a
          href="index.html"
          style="
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
          "
        >
          <img
            src="https://res.cloudinary.com/dsk6vsr0c/image/upload/q_auto/f_auto/v1777767088/Logo_qum5kw.png"
            alt="Logo de Turismo Ica"
            class="logo-imagen"
          />
          <span class="logo-texto"
            ><h1 style="color: #1a1a1a">Turismo Ica</h1></span
          >
        </a>
      </div>
      <div class="contenedor-derecha-header">
        <a href="Login.html" title="Login" class="enlace-perfil-usuario">
          <i class="fa-solid fa-user"></i>
        </a>
        <button class="menu-hamburguesa" id="botonMenu" aria-label="Abrir menú">
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
        </button>
      </div>
      <nav id="menuPrincipal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="Nosotros.html">Nosotros</a></li>
          <li><a href="Destino.html">Destinos</a></li>
          <li><a href="Tabla_Descuento.html">Descuentos</a></li>
          <li><a href="Preguntas.html">Preguntas</a></li>
        </ul>
      </nav>
    </header>

    <div class="layout-perfil">
      <aside class="sidebar-perfil">
        <div class="perfil-resumen" style="text-align: center; margin-bottom: 20px; width: 100%;">
            <div style="background: var(--color-boton); color: white; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 10px auto; box-shadow: 0 4px 10px rgba(229, 29, 42, 0.3);">
              <i class="fa-solid fa-user"></i>
            </div>
            <h3 id="nombreAdminDinámico" style="margin: 0; color: var(--color-oscuro); font-size: 1.2rem;">Cargando...</h3>
            <p style="color: #888; font-size: 0.85rem; margin: 5px 0 0 0; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Administrador</p>
        </div>
        <nav class="nav-sidebar">
          <a
            href="#"
            id="btn-usuarios"
            onclick="mostrarSeccion('usuarios')"
            class="activo"
          >
            <i class="fa-solid fa-users"></i> Usuarios
          </a>
          <a href="#" id="btn-destinos" onclick="mostrarSeccion('destinos')">
            <i class="fa-solid fa-map-location-dot"></i> Destinos
          </a>
          <a href="#" id="btn-reservas" onclick="mostrarSeccion('reservas')">
            <i class="fa-solid fa-receipt"></i> Reservas
          </a>
        </nav>
      </aside>

      <main class="contenido-perfil" id="contenedor-principal"></main>
    </div>

    <div
      id="modalEditor"
      class="overlay-pago oculto"
      style="display: none; z-index: 2000"
    >
      <div
        class="cuadro-vidrio-borroso"
        style="max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto"
      >
        <h2 class="texto-titulo-grande" id="tituloEditor">Editar Destino</h2>
        <form id="formEditor" onsubmit="return false;">
          <input type="hidden" id="edit-id" />
          <div class="contenedor-pregunta-respuesta">
            <label>Título del Destino:</label>
            <input type="text" id="edit-titulo" required />
          </div>
          <div class="contenedor-pregunta-respuesta">
            <label>Días Programados (Separa cada fecha con una coma):</label>
            <input
              type="text"
              id="edit-dias"
              placeholder="Ej: Sábado 25 de Abril, Domingo 26 de Abril"
            />
          </div>
          <div class="fila-formulario-doble">
            <div class="contenedor-pregunta-respuesta">
              <label>Precio Grupal (S/):</label>
              <input type="number" id="edit-precio-grupal" step="0.01" />
            </div>
            <div class="contenedor-pregunta-respuesta">
              <label>Precio Privado (S/):</label>
              <input type="number" id="edit-precio-privado" step="0.01" />
            </div>
          </div>
          <div class="contenedor-pregunta-respuesta">
            <label>Descripción Larga (Itinerario):</label>
            <textarea
              id="edit-descripcion"
              rows="6"
              style="
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #ddd;
              "
            ></textarea>
          </div>
          <div class="contenedor-pregunta-respuesta">
            <label>URL de Imagen Principal:</label>
            <input type="text" id="edit-imagen" />
          </div>
          <div class="contenedor-pregunta-respuesta">
            <label>Descripción Corta (Para tarjetas del catálogo):</label>
            <textarea
              id="edit-descripcion-corta"
              rows="2"
              style="
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #ddd;
              "
            ></textarea>
          </div>

          <div class="contenedor-pregunta-respuesta">
            <label>Imágenes de la Galería (4 fotos de detalle):</label>
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px"
            >
              <input
                type="text"
                id="img-galeria-1"
                placeholder="URL Foto 1 (Cloudinary)"
              />
              <input type="text" id="img-galeria-2" placeholder="URL Foto 2" />
              <input type="text" id="img-galeria-3" placeholder="URL Foto 3" />
              <input type="text" id="img-galeria-4" placeholder="URL Foto 4" />
            </div>
          </div>
          <div class="fila-formulario-doble">
            <div class="contenedor-pregunta-respuesta">
              <label>Porcentaje Descuento (%):</label>
              <input type="number" id="edit-porcentaje" min="0" max="100" />
            </div>
            <div class="contenedor-pregunta-respuesta">
              <label>Ubicación:</label>
              <input type="text" id="edit-ubicacion" />
            </div>
          </div>
          <div
            style="
              margin-top: 25px;
              padding: 15px;
              background: #f9f9f9;
              border-radius: 8px;
              border: 1px solid #ddd;
            "
          >
            <h4
              style="
                margin-top: 0;
                margin-bottom: 15px;
                color: var(--color-oscuro);
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              Línea de Tiempo (Itinerario)
              <button
                type="button"
                onclick="agregarFilaItinerario()"
                style="
                  background: var(--color-boton);
                  color: white;
                  border: none;
                  padding: 6px 12px;
                  border-radius: 5px;
                  cursor: pointer;
                  font-size: 0.85rem;
                  font-weight: bold;
                "
              >
                <i class="fa-solid fa-plus"></i> Añadir Hora
              </button>
            </h4>
            <div
              id="contenedor-itinerario-admin"
              style="display: flex; flex-direction: column; gap: 15px"
            ></div>
          </div>
          <div style="display: flex; gap: 15px; margin-top: 30px">
            <button
              type="button"
              onclick="cerrarEditor()"
              class="boton-rojo-ingresar"
              style="background-color: #555; width: 100%"
            >
              CANCELAR
            </button>
            <button
              type="submit"
              class="boton-rojo-ingresar"
              style="width: 100%"
            >
              GUARDAR CAMBIOS
            </button>
          </div>
        </form>
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const usuario = sessionStorage.getItem("usuarioLogueado") || "Admin";
        // Tomamos solo el primer y segundo nombre
        const nombre = usuario.split(" ")[0] + " " + (usuario.split(" ")[1] || "");
        const nombreElemento = document.getElementById("nombreAdminDinámico");
        if (nombreElemento) nombreElemento.textContent = nombre;
      });
    </script>
    <script src="JavaScript/Prueba2.js"></script>
  </body>
</html>
