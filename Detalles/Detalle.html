<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargando... | Turismo Ica</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/Prueba2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          src="https://res.cloudinary.com/dsk6vsr0c/image/upload/q_auto/f_auto/v1777767088/Logo_qum5kw.png"
          alt="Logo de Turismo Ica"
          class="logo-imagen"
        />
        <span class="logo-texto"><h1>Turismo Ica</h1></span>
      </div>
      <div class="contenedor-derecha-header">
        <a href="../Login.html" title="Login" class="enlace-perfil-usuario">
          <i class="fa-solid fa-user"></i>
        </a>
        <button class="menu-hamburguesa" id="botonMenu" aria-label="Abrir menú">
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
          <span class="linea-menu"></span>
        </button>
      </div>
      <nav id="menuPrincipal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="../Nosotros.html">Nosotros</a></li>
          <li><a href="../Destino.html">Destinos</a></li>
          <li><a href="../Reserva.html">Reservas</a></li>
          <li><a href="../Tabla_Descuento.html">Descuentos</a></li>
          <li><a href="../Preguntas.html">Preguntas</a></li>
        </ul>
      </nav>
    </header>

    <section class="portada-interna" id="portada-fondo">
      <h2 id="titulo-destino">Cargando...</h2>
    </section>

    <main class="pantalla-dividida-historia-reserva">
      <section class="lado-izquierdo-historia">
        <h2 class="texto-titulo-grande">Detalles del Tour</h2>
        <p id="descripcion-larga">Cargando itinerario...</p>

        <h3>Galería de Imágenes</h3>
        <div class="grilla-de-fotos-pequenas" id="galeria-fotos"></div>

        <div class="contenedor-boton-al-medio">
            <a href="#" id="link-mas-info" class="boton-rojo-ingresar">Más Información</a>
        </div>

        <div id="seccion-postear-comentario" class="cuadro-opinion-cliente seccion-posteo-borde"></div>

        <hr class="raya-horizontal-divisora" />
        <h3>Comentarios de Viajeros</h3>
        <div id="contenedor-comentarios"></div>
      </section>

      <aside class="lado-derecho-formulario">
        <div class="formulario-que-te-persigue">
          <h3>Reserva tu Aventura</h3>
          <p id="label-desde" class="label-precio-desde"></p>

          <form action="../Boleta/Pago.html">
            <div class="contenedor-pregunta-respuesta">
              <label for="tipo-tour">Tipo de Tour:</label>
              <select id="tipo-tour" onchange="cambiarSelectorFecha()" title="Selecciona el tipo de tour">
                <option value="grupal">Tour Grupal Compartido</option>
                <option value="privado">Tour Privado</option>
              </select>
            </div>

            <div
              class="contenedor-pregunta-respuesta"
              id="contenedor-fechas-fijas"
            >
              <label>Días programados:</label>
              <select id="selector-fechas-fijas" title="Selecciona un día programado">
                <option>Sábado 25 de Abril</option>
                <option>Domingo 26 de Abril</option>
              </select>
            </div>

            <div
              class="contenedor-pregunta-respuesta"
              id="contenedor-fecha-libre"
              class="contenedor-fecha-libre-oculto"
            >
              <label>Elige tu fecha:</label>
              <input type="date" title="Elige tu fecha" />
            </div>

            <div class="contenedor-pregunta-respuesta">
              <label>Pasajeros:</label>
              <input type="number" min="1" value="1" required title="Número de pasajeros" />
            </div>

            <button type="submit" class="boton-rojo-ingresar">
              Reservar Ahora
            </button>
          </form>
        </div>
      </aside>
    </main>

    <script src="../JavaScript/Prueba2.js"></script>
  </body>
</html>
